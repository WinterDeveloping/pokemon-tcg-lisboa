<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130">
  <g stroke="#2a2118" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- the stick tail poking out behind the cloth -->
    <path d="M96 96 L110 86 L103 78 L118 66" fill="none" stroke="#6b4a2b" stroke-width="5"/>
    <path d="M96 96 L110 86 L103 78 L118 66" fill="none" stroke-width="1.2"/>
